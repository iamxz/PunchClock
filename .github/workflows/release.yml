name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Build Universal Binary
        run: make pkg
        
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/Daka-*.pkg
          generate_release_notes: true
