name: Auto Tag
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version X.Y.Z (default: read Resources/Info.plist)'
        required: false
permissions:
  contents: write
concurrency:
  group: auto-tag-main
  cancel-in-progress: false
jobs:
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist','rb'))['CFBundleShortVersionString'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || (echo "CFBundleShortVersionString must be X.Y.Z, got $VERSION" >&2; exit 1)
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Skip if tag exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ env.TAG }}" | grep -q "refs/tags/${{ env.TAG }}$"; then
            echo "Tag ${{ env.TAG }} already exists, skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Create and push tag
        if: env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse -q --verify "refs/tags/${{ env.TAG }}" >/dev/null || git tag "${{ env.TAG }}"
          git push origin "${{ env.TAG }}"
